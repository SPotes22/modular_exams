{% extends 'base.html' %}
{% block title %}Unirse a capacitación{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-key display-4 text-primary"></i>
                    <h4 class="fw-bold mt-2 mb-1">Unirse a una capacitación</h4>
                    <p class="text-muted small mb-0">Pídele a tu profesor el código de la capacitación.</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Código</label>
                        <input type="text" name="code" class="form-control form-control-lg text-center text-uppercase font-monospace"
                               placeholder="Ej. A1B2C3" maxlength="10" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Unirme
                    </button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('learning.student_catalog') }}" class="small text-muted">
                        <i class="bi bi-arrow-left me-1"></i>Volver a mis cursos
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
