{% extends 'base.html' %}
{% block title %}Unirse a Examen{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center">
                <h4>Unirse a una Evaluación</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('auth.student_join_exam') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" name="student_name" class="form-control" placeholder="Ej. Santiago Potes" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Código de la Sala</label>
                        <input type="text" name="session_code" class="form-control text-uppercase" placeholder="Ej. A1B2C3" required maxlength="6">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Entrar a la Sala</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
