{% extends 'base.html' %}{% block content %}<h1>Mis clases</h1><form method="post" class="card p-3 mb-4"><div class="row"><div class="col"><input name="name" class="form-control" placeholder="Clase" required></div><div class="col"><input name="subject" class="form-control" placeholder="Asignatura"></div><div class="col"><button class="btn btn-primary">Crear clase</button></div></div></form>{% for cls in classes %}<div class="card mb-3"><div class="card-body"><h5>{{ cls.name }} <small class="text-muted">{{ cls.subject }}</small></h5><form method="post" action="{{ url_for('exams.assign_exam_class', class_id=cls.id) }}" class="d-flex gap-2"><select name="exam_id" class="form-select">{% for exam in exams %}<option value="{{ exam.id }}">{{ exam.title }}</option>{% endfor %}</select><button class="btn btn-outline-primary">Asignar examen</button></form><ul class="mt-3">{% for exam in cls.exams %}<li>{{ exam.title }}</li>{% endfor %}</ul></div></div>{% endfor %}{% endblock %}
