<label class="form-label">Banco</label><select name="bank_id" class="form-select" required>{% for bank in banks %}<option value="{{ bank.id }}">{{ bank.name }}</option>{% endfor %}</select>
<label class="form-label mt-2">Enunciado</label><textarea name="statement" class="form-control" required></textarea>
<div class="row"><div class="col"><label class="form-label mt-2">Tipo</label><select name="question_type" class="form-select question-type-select"><option value="multiple_choice">Selección única</option><option value="multiple_select">Selección múltiple</option><option value="true_false">Verdadero/Falso</option><option value="open_answer">Respuesta abierta</option><option value="matching">Emparejamiento</option><option value="ordering">Ordenamiento</option></select></div><div class="col"><label class="form-label mt-2">Puntos</label><input type="number" step="0.1" min="0.1" name="default_points" value="1" class="form-control"></div></div>
<label class="form-label mt-2">Opciones (marca correctas por índice)</label><input name="options[]" class="form-control mb-1" placeholder="Opción 1"><input name="options[]" class="form-control mb-1" placeholder="Opción 2"><label><input type="checkbox" name="correct_options[]" value="0"> Opción 1 correcta</label> <label><input type="checkbox" name="correct_options[]" value="1"> Opción 2 correcta</label>
<label class="form-label mt-2">V/F correcto</label><select name="true_false_correct" class="form-select"><option value="true">Verdadero</option><option value="false">Falso</option></select>
<label class="form-label mt-2">Categoría</label><input name="category" class="form-control" value="General">
<label class="form-label mt-2">Imagen URL</label><input name="image_url" class="form-control" placeholder="/static/uploads/...">
<label class="form-label mt-2">Retroalimentación</label><textarea name="feedback_text" maxlength="3000" class="form-control" rows="3"></textarea>
